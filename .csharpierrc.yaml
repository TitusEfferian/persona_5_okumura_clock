# CSharpier configuration (https://csharpier.com/docs/Configuration)
# All values are the CSharpier defaults; this file exists so the config
# location is explicit. Note: CSharpier 1.3.0 crashes on a YAML file that
# contains only comments, so at least one key must stay uncommented.
printWidth: 100
useTabs: false
indentSize: 4
endOfLine: auto
xmlWhitespaceSensitivity: strict
